name: room navigation and glyph qa
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rooms:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Room script syntax
        run: node --check rooms.js
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Current page, all rooms and claim firewalls
        run: python tests/rooms_browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-qa
          path: test-results/rooms
