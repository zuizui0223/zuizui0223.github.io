name: site graph qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check data.js
          node --check philosophy-data.js
          node --check thoughts.js
          node --check interaction-series.js
          node --check niche-program.js
          node --check odsp-homepage-update.js
          node --check mechanism-split.js
          node --check aza3-acsp-bridge.js
          node --check app.js
          node --check philosophy-ui.js
      - name: Audit JSON syntax
        run: |
          python -m json.tool repo-audit.json >/dev/null
          python -m json.tool repository-classification-audit.json >/dev/null
          python -m json.tool portfolio-graph-audit.json >/dev/null
          python -m json.tool viewpoint-audit.json >/dev/null
          python -m json.tool niche-program-audit.json >/dev/null
          python -m json.tool tnoa-rec-audit.json >/dev/null
          python -m json.tool aza3-acsp-field-bridge-audit.json >/dev/null
          python -m json.tool ecosystem-system-audit.json >/dev/null
      - name: Canonical graph semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('portfolio-graph-audit.json').read_text())
          view = json.loads(Path('viewpoint-audit.json').read_text())
          repo = json.loads(Path('repo-audit.json').read_text())
          classification = json.loads(Path('repository-classification-audit.json').read_text())
          ecosystem = json.loads(Path('ecosystem-system-audit.json').read_text())

          nonlinear = {x['id']: x for x in graph['nonlinear_constellations']}
          vertical = {x['id']: x for x in graph['vertical_programmes']}
          standalone = {x['id']: x for x in graph.get('standalone_programmes', [])}
          assert nonlinear['observation']['shape'] == 'branched_development_plus_reverse_relation'
          assert nonlinear['crest_state_theory']['shape'] == 'hub'
          assert nonlinear['flower']['shape'] == 'complementary_arms_with_focal_origin'
          assert vertical['niche']['shape'] == 'epistemic_sequence'
          assert vertical['ecogenetic']['shape'] == 'parent_extension'
          assert standalone['state_measurement_empirical']['nodes'] == ['egwee']
          assert graph['ecosystem_system']['id'] == 'research-ecosystem-system-v1'
          assert view['scientific_graph']['ecosystem_system']['audit'] == 'ecosystem-system-audit.json'
          assert ecosystem['system_rule'] == 'connection != ownership'
          assert len(ecosystem['node_roles']) == 30
          assert any(x.get('from') == 'hotarubukuro' and x.get('to') == 'izu-core' and x.get('type') == 'shared_substrate' for x in ecosystem['cross_series_relations'])
          assert any(x.get('from') == 'izu-core' and x.get('to') == 'egwee' and x.get('type') == 'shared_substrate' for x in ecosystem['cross_series_relations'])
          assert any(x.get('from') == 'tnoa' and x.get('to') == 'egwee' for x in ecosystem['cross_series_relations'])
          assert any(x.get('from') == 'egwee' and x.get('to') == 'ced' for x in ecosystem['cross_series_relations'])
          assert any(x.get('from') == 'mrod' and x.get('to') == 'acsp' and x.get('type') == 'complement' for x in ecosystem['cross_series_relations'])
          assert view['phd_path']['scientific_dependency'] is False
          assert repo['repository_inventory']['scientific_active'] == 30
          assert classification['counts']['scientific_active'] == 30
          assert classification['newly_classified']['egwee']['class'] == 'scientific_active'
          assert not Path('microdonta-role.js').exists()
          assert not Path('microdonta-role.css').exists()
          PY
      - name: Asset cache guard
        run: |
          grep -q 'aza3-acsp-bridge.js?v=20260904c' index.html
          grep -q 'app.js?v=20260904a' index.html
          grep -q 'fill="url(#voidFill)" filter="url(#softGlow)"' index.html
          grep -q 'shared_substrate' app.js
          grep -q '30 · static' index.html
          ! grep -q 'microdonta-role' index.html
