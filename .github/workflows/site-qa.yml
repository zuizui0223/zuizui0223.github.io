name: tower and archived-map qa
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the earlier map's complete regression guards
        run: python scripts/check_legacy_archive.py
      - name: Current tower syntax and typed-contact contract
        run: |
          node --check tower.js
          node --check tower-data.js
          node --check tower-echo-data.js
          node --check tower-perspective-clue.js
          node --check tower-echo-clue.js
          node tests/tower_contract.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction regression
        run: python tests/tower_browser_test.py
